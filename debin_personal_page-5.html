<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Debin Dadji George — a personal page from Kerala, India.">
  <meta name="author" content="Debin Dadji George">
  <meta name="robots" content="index, follow">
  <title>Debin — Debin Dadji George</title>
  <style>
    :root { --bg:#0b0b0d; --text:#f4f4f0; --muted:#99999a; --line:#242428; }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
    }
    main { width:min(760px, 90%); padding:70px 0; }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:110px; }
    .mark { font-size:18px; font-weight:700; letter-spacing:.08em; }
    .place { color:var(--muted); font-size:14px; }
    h1 { font-size:clamp(58px, 12vw, 108px); line-height:.9; letter-spacing:-.07em; margin:0 0 28px; font-weight:700; }
    .full { font-size:19px; margin-bottom:52px; }
    .intro { max-width:570px; color:#c2c2c3; font-size:18px; line-height:1.7; margin:0; }
    .line { border:0; border-top:1px solid var(--line); margin:70px 0 24px; }
    .links { display:flex; gap:26px; flex-wrap:wrap; }
    a { color:var(--text); text-decoration:none; font-size:15px; border-bottom:1px solid #555; padding-bottom:3px; }
    a:hover { border-color:var(--text); }
    footer { margin-top:90px; color:#66666a; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div class="mark">D.</div>
      <div class="place">Kerala, India</div>
    </div>

    <h1>Debin</h1>
    <div class="full">Debin Dadji George</div>

    <p class="intro">
      A personal page for Debin Dadji George, from Kerala, India.
      A simple space for selected work, projects and things worth sharing.
    </p>

    <hr class="line">

    <div class="links">
      <a href="https://instagram.com/de_bynn" target="_blank" rel="noopener">Instagram ↗</a>
      <a href="mailto:de_bynn@instagram.com">Contact ↗</a>
    </div>

    <footer>© 2026 Debin Dadji George</footer>
  </main>
</body>
</html>
